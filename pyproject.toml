[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitscope"
version = "0.1.0"
description = "Analyze git history and turn it into actionable hotspot and bus-factor risk reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "GitScope Contributors" },
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
gitscope = "gitscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gitscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

